name: Build and deploy NODE06

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: node06-neocities
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate static field
        run: python build.py

      - name: Check generated files exist
        run: test -f dist/index.html && test -f dist/data/points.json

      - name: Deploy to Neocities
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_TOKEN }}
          cleanup: true
          neocities_supporter: false
          preview_before_deploy: true
          dist_dir: dist

  backend-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend checks
        run: python -m pip install '.[dev]'

      - name: Run backend tests and lint
        run: |
          pytest
          ruff check backend
          ruff format --check backend

      - name: Render bootstrap migration SQL
        run: alembic upgrade head --sql > /dev/null
