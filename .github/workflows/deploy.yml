name: Build and deploy NODE06

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: node06-neocities-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate static field
        run: python build.py

      - name: Check generated files exist
        run: test -f dist/index.html && test -f dist/data/points.json

      - name: Check browser JavaScript and iframe protocol
        run: |
          node --check static/site.js
          node --check static/point-picker.js
          node --check backend/src/node06_service/ui/editor.js
          python -m json.tool static/connection.json > /dev/null
          node --check backend/src/node06_service/ui/sites.js
          node --check backend/src/node06_service/ui/bridge.js
          node --check backend/src/node06_service/ui/bridge-client.js
          node --check scripts/check-hosted-wiki.cjs
          node prototypes/embed-p00/tests/protocol.test.mjs

      - name: Deploy to Neocities
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_TOKEN }}
          cleanup: true
          neocities_supporter: false
          preview_before_deploy: true
          dist_dir: dist

  backend-bootstrap:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: node06_test_ci
          POSTGRES_USER: node06_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U node06_test -d node06_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE06_TEST_DATABASE_URL: postgresql+psycopg://node06_test@127.0.0.1:5432/node06_test_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend checks
        run: python -m pip install '.[dev]'

      - name: Run backend tests and lint
        run: |
          pytest
          ruff check backend scripts/check-hosted-browser.py
          ruff format --check backend scripts/check-hosted-browser.py

      - name: Check installable wheel includes UI resources
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/node06-wheel" .
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next((Path(os.environ['RUNNER_TEMP']) / 'node06-wheel').glob('*.whl'))
          with ZipFile(wheel) as archive:
              for source in Path('backend/src/node06_service').rglob('*'):
                  if source.is_file() and source.suffix in ('.py', '.html', '.js'):
                      assert archive.read(str(source.relative_to('backend/src'))) == source.read_bytes()
          PY

      - name: Render bootstrap migration SQL
        run: alembic upgrade head --sql > /dev/null
